<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>꽃길 - 산책길과 꽃길을 찾는 지도 앱</title>
    <meta name="description" content="꽃길은 주변 산책길과 꽃길을 지도에서 탐색하고 저장할 수 있는 앱입니다." />
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f1e8;
        --surface: rgba(255, 252, 246, 0.92);
        --text: #2a2420;
        --muted: #645c56;
        --line: #d7cab8;
        --accent: #2d6a63;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "SUIT", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(217, 196, 163, 0.38), transparent 28%),
          linear-gradient(180deg, #fcf9f4 0%, var(--bg) 100%);
      }

      main { max-width: 920px; margin: 0 auto; padding: 64px 20px 80px; }

      .hero, .section {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 32px;
        box-shadow: 0 18px 50px rgba(66, 49, 28, 0.08);
      }

      .hero { padding: 44px 36px; }
      .section { padding: 28px 30px; margin-top: 16px; }
      h1 { margin: 0 0 14px; font-size: clamp(40px, 7vw, 72px); line-height: 1.05; }
      h2 { margin: 0 0 14px; }
      p, li { color: var(--muted); line-height: 1.75; }
      ul { margin: 0; padding-left: 20px; }
      a { color: var(--accent); font-weight: 700; }
      .eyebrow { color: var(--accent); font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
      .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fffaf1;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <p class="eyebrow">Kkotgil</p>
        <h1>꽃길</h1>
        <p>
          꽃길은 주변 산책길과 계절의 꽃길을 지도에서 탐색하고 저장할 수 있는 앱입니다.
          더 걷고 싶은 길을 쉽게 발견할 수 있도록 준비 중입니다.
        </p>
        <div class="links">
          <a class="button" href="/kkotgil/privacy/ko/">개인정보처리방침</a>
          <a class="button" href="/kkotgil/terms/ko/">서비스 이용약관</a>
          <a class="button" href="/kkotgil/delete-account/ko/">계정 삭제 안내</a>
        </div>
      </section>

      <section class="section">
        <h2>문의</h2>
        <p>studio nani · <a href="mailto:studionani.official@google.com">studionani.official@google.com</a></p>
      </section>
    </main>
  </body>
</html>
