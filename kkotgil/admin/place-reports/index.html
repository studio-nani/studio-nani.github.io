<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>꽃길 제보 검수</title>
  <style>
    :root { color-scheme: light dark; --accent: #e8557a; --muted: #777; --border: #ddd; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #fff7f9; color: #231f20; }
    header { position: sticky; top: 0; z-index: 1; background: rgba(255, 247, 249, .94); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 16px 20px; }
    main { max-width: 1120px; margin: 0 auto; padding: 20px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input, select, textarea, button { font: inherit; border-radius: 10px; border: 1px solid var(--border); padding: 10px 12px; }
    input[type=password] { min-width: 280px; }
    button { cursor: pointer; background: white; }
    button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    button.warn { background: #fff1f1; border-color: #ffb4b4; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
    .card { background: white; border: 1px solid var(--border); border-radius: 18px; padding: 16px; box-shadow: 0 8px 24px rgba(20, 0, 8, .06); }
    .meta { color: var(--muted); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; }
    .badge { border: 1px solid var(--border); border-radius: 999px; padding: 3px 8px; background: #fff; }
    .desc { white-space: pre-wrap; line-height: 1.45; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
    .field { margin-top: 10px; }
    .field label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .field input { width: 100%; box-sizing: border-box; }
    .link { color: var(--accent); font-weight: 700; text-decoration: none; }
    textarea { width: 100%; box-sizing: border-box; min-height: 68px; margin-top: 10px; }
    .empty, .error { padding: 24px; text-align: center; color: var(--muted); }
    .error { color: #b00020; }
    @media (prefers-color-scheme: dark) {
      body { background: #151014; color: #fff6f8; }
      header { background: rgba(21,16,20,.94); }
      .card, button, input, select, textarea, .badge { background: #21191f; color: #fff6f8; border-color: #46343e; }
      :root { --border: #46343e; --muted: #bbaab1; }
    }
  </style>
</head>
<body>
  <header>
    <h1>꽃길 제보 검수</h1>
    <div class="toolbar">
      <input id="email" type="email" placeholder="관리자 이메일" autocomplete="username" />
      <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" />
      <button class="primary" id="login">로그인</button>
      <button id="logout" hidden>로그아웃</button>
      <select id="status">
        <option value="open">열린 제보</option>
        <option value="queued">queued</option>
        <option value="triage">triage</option>
        <option value="verifying">verifying</option>
        <option value="needs_more_info">needs_more_info</option>
        <option value="approved_basic">approved_basic</option>
        <option value="approved_recommended">approved_recommended</option>
        <option value="rejected">rejected</option>
        <option value="hidden">hidden</option>
        <option value="all">전체</option>
      </select>
      <button class="primary" id="load">불러오기</button>
      <span class="meta" id="summary"></span>
    </div>
  </header>
  <main>
    <div id="message" class="empty">Supabase 관리자 계정으로 로그인하세요.</div>
    <section id="reports" class="grid"></section>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const loginButton = document.getElementById('login');
const logoutButton = document.getElementById('logout');
const statusInput = document.getElementById('status');
const loadButton = document.getElementById('load');
const summary = document.getElementById('summary');
const message = document.getElementById('message');
const reportsEl = document.getElementById('reports');

const DEFAULT_API_BASE = location.href.includes('/functions/v1/admin-place-reports')
  ? '.'
  : 'https://tqfzfgjclxjpojbetrms.supabase.co/functions/v1/admin-place-reports';
const apiBase = sessionStorage.getItem('kkotgil_admin_api_base') || DEFAULT_API_BASE;
let supabaseClient = null;
let accessToken = sessionStorage.getItem('kkotgil_admin_access_token') || '';

emailInput.value = sessionStorage.getItem('kkotgil_admin_email') || '';
statusInput.value = sessionStorage.getItem('kkotgil_admin_status') || 'open';
loadButton.addEventListener('click', loadReports);
loginButton.addEventListener('click', login);
logoutButton.addEventListener('click', logout);
initAuth();

async function initAuth() {
  try {
    const config = await apiConfig();
    supabaseClient = supabase.createClient(config.supabaseUrl, config.anonKey);
    updateAuthUi(Boolean(accessToken));
    if (accessToken) await loadReports();
  } catch (error) {
    message.className = 'error';
    message.textContent = '설정 로드 실패: ' + error.message;
  }
}

async function apiConfig() {
  const res = await fetch(apiBase + '/api/config');
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '설정 요청 실패');
  return data;
}

async function login() {
  if (!supabaseClient) return;
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  if (!email || !password) {
    message.className = 'error';
    message.textContent = '이메일과 비밀번호를 입력하세요.';
    return;
  }
  message.className = 'empty';
  message.textContent = '로그인 중...';
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error || !data.session?.access_token) {
    message.className = 'error';
    message.textContent = error?.message || '로그인 실패';
    return;
  }
  accessToken = data.session.access_token;
  sessionStorage.setItem('kkotgil_admin_access_token', accessToken);
  sessionStorage.setItem('kkotgil_admin_email', email);
  passwordInput.value = '';
  updateAuthUi(true);
  await loadReports();
}

async function logout() {
  if (supabaseClient) await supabaseClient.auth.signOut();
  accessToken = '';
  sessionStorage.removeItem('kkotgil_admin_access_token');
  updateAuthUi(false);
  reportsEl.innerHTML = '';
  summary.textContent = '';
  message.className = 'empty';
  message.textContent = '로그아웃했습니다.';
}

function updateAuthUi(isLoggedIn) {
  emailInput.disabled = isLoggedIn;
  passwordInput.hidden = isLoggedIn;
  loginButton.hidden = isLoggedIn;
  logoutButton.hidden = !isLoggedIn;
}

async function api(path, options = {}) {
  if (!accessToken) throw new Error('로그인이 필요합니다.');
  const headers = { Authorization: 'Bearer ' + accessToken, ...(options.headers || {}) };
  const res = await fetch(apiBase + path, { ...options, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '요청 실패');
  return data;
}

async function loadReports() {
  reportsEl.innerHTML = '';
  message.className = 'empty';
  message.textContent = '불러오는 중...';
  summary.textContent = '';
  sessionStorage.setItem('kkotgil_admin_status', statusInput.value);
  try {
    const data = await api('/api/reports?status=' + encodeURIComponent(statusInput.value));
    const reports = data.reports || [];
    message.textContent = reports.length ? '' : '표시할 제보가 없습니다.';
    summary.textContent = reports.length + '건';
    reportsEl.innerHTML = reports.map(renderReport).join('');
    document.querySelectorAll('[data-action]').forEach((button) => {
      button.addEventListener('click', () => submitReview(button));
    });
  } catch (error) {
    message.className = 'error';
    message.textContent = error.message;
  }
}

function renderReport(report) {
  const rawId = String(report.id || '');
  const id = escapeHtml(rawId);
  const noteId = 'note-' + id;
  const reasonId = 'reason-' + id;
  const infoId = 'info-' + id;
  const locationHint = String(report.location_hint || '');
  const mapUrl = 'https://map.naver.com/p/search/' + encodeURIComponent(locationHint || report.place_name || '');
  const needsMoreInfo = Array.isArray(report.needs_more_info_fields)
    ? report.needs_more_info_fields.join(', ')
    : '';
  const accessNote = report.access_note
    ? '<p class="desc"><strong>접근 메모</strong><br>' + escapeHtml(report.access_note) + '</p>'
    : '';

  return [
    '<article class="card">',
    '  <div class="meta"><span class="badge">' + escapeHtml(report.verification_status) + '</span><span class="badge">' + escapeHtml(report.visibility_status) + '</span><span>' + formatDate(report.created_at) + '</span></div>',
    '  <h2>' + escapeHtml(report.place_name) + '</h2>',
    '  <p><strong>위치</strong><br>' + escapeHtml(locationHint) + ' <a class="link" href="' + escapeHtml(mapUrl) + '" target="_blank" rel="noreferrer">지도검색</a></p>',
    '  <p class="desc"><strong>추천 이유</strong><br>' + escapeHtml(report.description) + '</p>',
    '  <div class="meta">',
    '    <span>' + escapeHtml(report.path_type || '-') + '</span>',
    '    <span>' + escapeHtml(report.recommended_season || '-') + '</span>',
    '    <span>방문: ' + escapeHtml(report.visited_on || report.visited_on_raw || '-') + '</span>',
    '    <span>ID: ' + id + '</span>',
    '  </div>',
    accessNote,
    '  <textarea id="' + noteId + '" placeholder="운영자 메모">' + escapeHtml(report.operator_note || '') + '</textarea>',
    '  <div class="field"><label for="' + infoId + '">추가 정보 요청 필드(쉼표 구분)</label><input id="' + infoId + '" placeholder="예: 정확한 위치, 추천 계절" value="' + escapeHtml(needsMoreInfo) + '" /></div>',
    '  <div class="field"><label for="' + reasonId + '">거절 사유</label><input id="' + reasonId + '" placeholder="거절 시 필수" value="' + escapeHtml(report.rejection_reason || '') + '" /></div>',
    '  <div class="actions">',
    '    <button data-action="triage" data-id="' + id + '">분류</button>',
    '    <button data-action="verifying" data-id="' + id + '">검증중</button>',
    '    <button data-action="needs_more_info" data-id="' + id + '">추가정보</button>',
    '    <button class="primary" data-action="approve_basic" data-id="' + id + '">기본승인</button>',
    '    <button class="primary" data-action="approve_recommended" data-id="' + id + '">추천승인</button>',
    '    <button class="warn" data-action="reject" data-id="' + id + '">거절</button>',
    '    <button class="warn" data-action="hide" data-id="' + id + '">숨김</button>',
    '  </div>',
    '</article>',
  ].join('');
}

async function submitReview(button) {
  const reportId = button.dataset.id;
  const action = button.dataset.action;
  const note = document.getElementById('note-' + reportId)?.value || null;
  const rejectionReason = document.getElementById('reason-' + reportId)?.value || null;
  const needsMoreInfoFields = (document.getElementById('info-' + reportId)?.value || '')
    .split(',')
    .map((value) => value.trim())
    .filter(Boolean);
  if (action === 'reject' && !rejectionReason) {
    alert('거절 사유를 입력하세요.');
    return;
  }
  if (action === 'needs_more_info' && !note && needsMoreInfoFields.length === 0) {
    alert('추가 정보 요청은 운영자 메모나 요청 필드가 필요합니다.');
    return;
  }
  if ((action === 'approve_basic' || action === 'approve_recommended') && !confirm('이 제보를 공개 후보로 승인할까요?')) {
    return;
  }
  if ((action === 'reject' || action === 'hide') && !confirm('이 제보를 숨김/거절 상태로 변경할까요?')) {
    return;
  }
  button.disabled = true;
  try {
    await api('/api/review', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        report_id: reportId,
        action,
        note,
        rejection_reason: rejectionReason,
        needs_more_info_fields: needsMoreInfoFields,
      }),
    });
    await loadReports();
  } catch (error) {
    alert(error.message);
  } finally {
    button.disabled = false;
  }
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[ch]));
}

function formatDate(value) {
  if (!value) return '-';
  return new Intl.DateTimeFormat('ko-KR', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(value));
}
</script>
</body>
</html>
